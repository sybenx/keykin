# Builds the two container images and pushes them to GitHub's registry when a version tag is pushed.
#   ghcr.io/<owner>/keykin-box:<version>     the box: pieces, signing, admin page
#   ghcr.io/<owner>/keykin-login:<version>   Keykin Login: the public door and the account page
name: images
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npx tsc
      # The relay, browser and Chromium tests skip themselves where their tools are missing.
      - run: node --test test/keykin.test.ts test/accounts.test.ts test/page.test.ts test/http.test.ts
  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: keykin-box, file: deploy/Dockerfile }
          - { name: keykin-login, file: deploy/Dockerfile.login }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
